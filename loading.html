<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>世界の国名当てゲーム</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>%F0%9F%8C%8F</text></svg>">
<style>
  html,body{ margin:0; padding:0; height:100%; background:#0b1622; }
  body{
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:18px;
    font-family:-apple-system, BlinkMacSystemFont, 'Hiragino Sans', sans-serif;
    color:#eae3d3;
  }
  .boot-spinner{
    width:44px; height:44px; border-radius:50%;
    border:4px solid rgba(232,224,208,0.18); border-top-color:#e8a33d;
    animation: boot-spin 0.9s linear infinite;
  }
  .boot-text{ font-size:15px; font-weight:700; letter-spacing:0.05em; }
  .boot-dots span{ display:inline-block; opacity:0.15; animation: boot-blink 1.4s infinite; }
  .boot-dots span:nth-child(1){ animation-delay:0s; }
  .boot-dots span:nth-child(2){ animation-delay:0.2s; }
  .boot-dots span:nth-child(3){ animation-delay:0.4s; }
  @keyframes boot-spin{ to{ transform:rotate(360deg); } }
  @keyframes boot-blink{ 0%,80%,100%{ opacity:0.15; } 40%{ opacity:1; } }
</style>
</head>
<body>
  <div class="boot-spinner"></div>
  <div class="boot-text">せつぞくちゅう<span class="boot-dots"><span>・</span><span>・</span><span>・</span></span></div>
  <script>
    // コノページ自体はほとんど中身が無いカラ、一瞬で届いてスグ「接続中」が見えるハズダヨ。
    // 表示できたラ、スグに本体(index.html)へ移動するヨ。?vsjoin=1234 みたいなパラメータも引き継ぐヨ。
    // location.replace()を使うカラ、戻るボタンでコノ中継ページに戻ってくるコトも無いヨ。
    location.replace('./index.html' + location.search);
  </script>
</body>
</html>
